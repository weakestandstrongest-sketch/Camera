<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="無音カメラ">
  <meta name="theme-color" content="#060509">
  <title>無音カメラ</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/lens-180.png">
  <link rel="icon" type="image/png" href="icons/lens-192.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- 画面で使うアイコン -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <symbol id="i-grid" viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="17" height="17" rx="3"/><path d="M9.2 3.5v17M14.8 3.5v17M3.5 9.2h17M3.5 14.8h17"/></symbol>
      <symbol id="i-timer" viewBox="0 0 24 24"><circle cx="12" cy="13" r="7.5"/><path d="M12 9.5V13l2.2 1.6M9.5 2.8h5"/></symbol>
      <symbol id="i-date" viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15" rx="3"/><path d="M3.5 9.5h17M8 3v4M16 3v4"/><path d="M8.5 13.5h2M13.5 13.5h2M8.5 16.5h2"/></symbol>
      <symbol id="i-torch" viewBox="0 0 24 24"><path d="M13 2.5 5.5 13.5h6l-1 8 7.5-11h-6z"/></symbol>
      <symbol id="i-lens" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="4"/><path d="M12 3.5 16 12M20.5 12 12 16M12 20.5 8 12M3.5 12 12 8"/></symbol>
      <symbol id="i-flip" viewBox="0 0 24 24"><path d="M20 11a8 8 0 0 0-14.3-4.9L4 8"/><path d="M4 4v4h4"/><path d="M4 13a8 8 0 0 0 14.3 4.9L20 16"/><path d="M20 20v-4h-4"/></symbol>
      <symbol id="i-down" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></symbol>
      <symbol id="i-back" viewBox="0 0 24 24"><path d="m15 5-7 7 7 7"/></symbol>
      <symbol id="i-share" viewBox="0 0 24 24"><path d="M12 3v12M7.5 7.5 12 3l4.5 4.5"/><path d="M5 12.5V19a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-6.5"/></symbol>
      <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 6.5h16M9.5 6.5V4.5h5v2M6.5 6.5l1 13a1.5 1.5 0 0 0 1.5 1.4h6a1.5 1.5 0 0 0 1.5-1.4l1-13"/><path d="M10 10.5v7M14 10.5v7"/></symbol>
      <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7.5"/></symbol>
      <symbol id="i-mute" viewBox="0 0 24 24"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/><path d="m16 9.5 5 5M21 9.5l-5 5"/></symbol>
    </defs>
  </svg>

  <main id="camera" class="mode-photo">
    <header id="topbar">
      <div id="status" class="glass">
        <span class="status-dot"></span>
        <span id="status-text">SILENT</span>
      </div>
      <div id="tools" class="glass">
        <button id="btn-grid" class="tool" aria-label="グリッド" aria-pressed="false"><svg><use href="#i-grid"/></svg></button>
        <button id="btn-timer" class="tool" aria-label="セルフタイマー" aria-pressed="false"><svg><use href="#i-timer"/></svg><span id="timer-badge" hidden></span></button>
        <button id="btn-date" class="tool photo-only" aria-label="日付スタンプ" aria-pressed="false"><svg><use href="#i-date"/></svg></button>
        <button id="btn-torch" class="tool" aria-label="ライト" aria-pressed="false" hidden><svg><use href="#i-torch"/></svg></button>
        <button id="btn-lens" class="tool" aria-label="レンズを選ぶ" hidden><svg><use href="#i-lens"/></svg></button>
      </div>
    </header>

    <div id="stage">
      <div id="frame">
        <video id="preview" autoplay playsinline muted></video>
        <div id="look-vignette"></div>
        <div id="look-grain"></div>
        <div id="grid" hidden></div>
        <div id="brackets"><i></i><i></i><i></i><i></i></div>
        <canvas id="datestamp" hidden></canvas>
        <div id="hud"><span id="hud-res"></span><span id="hud-zoom"></span></div>
        <div id="flash"></div>
      </div>
      <div id="look-name" aria-live="polite"></div>
      <div id="countdown" hidden></div>
      <div id="zoom-label" class="glass" hidden></div>
      <div id="lens-menu" class="glass" hidden></div>
      <div id="message" hidden>
        <div class="message-card glass">
          <p id="message-text"></p>
          <button id="btn-retry" class="btn primary">もう一度試す</button>
        </div>
      </div>
    </div>

    <footer id="controls">
      <div id="looks" class="photo-only" role="radiogroup" aria-label="フィルター"></div>
      <div id="modes">
        <button class="mode active" data-mode="photo" aria-label="写真">PHOTO</button>
        <button class="mode" data-mode="video" aria-label="ビデオ">VIDEO</button>
      </div>
      <div id="shutter-row">
        <button id="btn-gallery" aria-label="ライブラリ">
          <img id="thumb" alt="" hidden>
          <span id="badge" hidden></span>
        </button>
        <button id="btn-shutter" aria-label="撮影"><span class="ring"></span><span class="core"></span></button>
        <button id="btn-flip" class="glass" aria-label="カメラ切り替え"><svg><use href="#i-flip"/></svg></button>
      </div>
    </footer>
  </main>

  <section id="gallery" hidden>
    <header class="sheet-header glass-bar">
      <button id="btn-gallery-close" class="icon-btn" aria-label="閉じる"><svg><use href="#i-down"/></svg></button>
      <div class="sheet-title">
        <h1>Library</h1>
        <span id="gallery-count"></span>
      </div>
      <button id="btn-select" class="text-btn">選択</button>
    </header>
    <div id="gallery-scroll">
      <p class="hint">保存すると共有シートが開きます。「画像を保存」「ビデオを保存」で写真アプリに入ります。</p>
      <div id="gallery-grid"></div>
      <div id="gallery-empty" hidden>
        <svg><use href="#i-mute"/></svg>
        <p>まだ何も撮っていません</p>
      </div>
    </div>
    <footer class="sheet-actions glass">
      <button id="btn-save-main" class="btn primary"></button>
      <button id="btn-delete-main" class="btn ghost-danger"></button>
    </footer>
  </section>

  <section id="viewer" hidden>
    <header class="sheet-header glass-bar">
      <button id="btn-viewer-close" class="icon-btn" aria-label="戻る"><svg><use href="#i-back"/></svg></button>
      <div class="sheet-title"><span id="viewer-info"></span></div>
      <span></span>
    </header>
    <div id="viewer-media"></div>
    <footer class="sheet-actions glass">
      <button id="btn-viewer-save" class="btn primary"><svg><use href="#i-share"/></svg>保存</button>
      <button id="btn-viewer-delete" class="btn ghost-danger" aria-label="削除"><svg><use href="#i-trash"/></svg></button>
    </footer>
  </section>

  <div id="toast" class="glass" role="status" aria-live="polite"></div>

  <script src="app.js"></script>
</body>
</html>
